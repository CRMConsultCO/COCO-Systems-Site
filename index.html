<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">

<style>
  *{box-sizing:border-box;}
  html,body{ height:100%; }
  body{
    margin:0; background:#020805; color:#3dff8a;
    font-family:'Space Mono', 'Courier New', monospace;
    overflow:hidden; position:relative;
  }
  body::before{
    content:''; position:fixed; inset:0; pointer-events:none; z-index:900;
    background:repeating-linear-gradient(0deg, rgba(0,0,0,0.15) 0px, rgba(0,0,0,0.15) 1px, transparent 1px, transparent 3px);
  }
  #matrixCanvas{ position:fixed; inset:0; z-index:0; opacity:0.15; pointer-events:none; }
  .glow{ text-shadow:0 0 6px #3dff8a, 0 0 12px rgba(61,255,138,0.4); }
  h1, h2, .mono-title{ font-family:'Share Tech Mono', 'Courier New', monospace; }

  /* ---------- BOOT SCREEN ---------- */
  #bootScreen{
    position:fixed; inset:0; background:rgba(0,0,0,0.78); color:#3dff8a; z-index:1000;
    display:flex; align-items:center; justify-content:center; flex-direction:column;
    cursor:pointer; user-select:none; text-align:center; padding:20px;
  }
  #bootScreen .boot-logo{ font-size:12px; line-height:1.15; margin:0 0 20px; }
  #bootScreen .boot-text{ font-size:1.1rem; letter-spacing:3px; }
  #bootScreen .boot-sub{ font-size:0.7rem; opacity:0.6; margin-top:14px; letter-spacing:1px; }
  .cursor{ display:inline-block; width:9px; height:16px; background:#3dff8a; animation:blink 1s step-start infinite; vertical-align:-3px; margin-left:4px; }
  @keyframes blink{ 50%{ opacity:0; } }

  #bootScreen.flicker{ animation:flicker 0.45s steps(2, end) forwards; }
  @keyframes flicker{
    0%{ background:#000; }
    15%{ background:#3dff8a; }
    30%{ background:#000; }
    45%{ background:#3dff8a; }
    60%{ background:#000; }
    100%{ background:#000; opacity:0; }
  }

  /* ---------- DESKTOP ---------- */
  #desktop{ display:none; height:100%; width:100%; position:relative; padding:14px 16px 52px; overflow-y:auto; }
  #desktop.on{ display:block; }
  .topbar{ display:flex; justify-content:space-between; font-size:11px; opacity:0.85; letter-spacing:1px; margin-bottom:14px; }

  .icons{ display:flex; flex-wrap:wrap; gap:22px; width:150px; }
  .icon-btn{
    background:none; border:1px solid transparent; color:#3dff8a; font-family:'Space Mono', monospace;
    width:110px; display:flex; flex-direction:column; align-items:center; gap:6px; cursor:pointer;
    padding:8px 4px; font-size:0.68rem; letter-spacing:0.5px;
  }
  .icon-btn .glyph{ font-size:1.9rem; line-height:1; }
  .icon-btn:hover, .icon-btn:focus-visible{ background:rgba(61,255,138,0.08); border-color:#1f6b40; outline:none; }
  .icon-btn.highlight{ color:#7fffb0; }

  /* status widget, sticky-note style */
  .widget{
    position:absolute; top:60px; right:20px; width:230px; border:1px solid #1f6b40;
    background:rgba(61,255,138,0.04); font-size:0.68rem; padding:12px 14px; line-height:1.7;
  }
  .widget h3{ margin:0 0 8px; font-size:0.7rem; letter-spacing:2px; border-bottom:1px solid #1f6b40; padding-bottom:6px; }
  .infra-line{ display:flex; justify-content:space-between; gap:10px; }
  .infra-line span:last-child{ text-align:right; }
  .widget .w-note{ opacity:0.7; margin-top:6px; }
  .status-ok{ color:#3dff8a; }

  /* ---------- WINDOWS ---------- */
  #windowLayer{ position:absolute; inset:0; pointer-events:none; }
  .window{
    position:absolute; min-width:280px; min-height:200px; background:#020805;
    border:1px solid #3dff8a; box-shadow:0 0 18px rgba(61,255,138,0.15);
    display:flex; flex-direction:column; pointer-events:auto;
  }
  .window .titlebar{
    display:flex; justify-content:space-between; align-items:center; cursor:grab;
    background:#0d2b1a; padding:6px 10px; border-bottom:1px solid #1f6b40; font-size:0.72rem; letter-spacing:1px;
  }
  .window .titlebar:active{ cursor:grabbing; }
  .window .titlebar .dots{ display:flex; gap:6px; }
  .window .titlebar .dots span{
    width:11px; height:11px; border-radius:50%; border:1px solid #3dff8a; background:transparent; cursor:pointer;
  }
  .window .titlebar .dots span.close:hover{ background:#3dff8a; }
  .window .titlebar .dots span.newtab:hover{ background:#3dff8a; }
  .window .resize-grip{
    position:absolute; right:0; bottom:0; width:16px; height:16px; cursor:nwse-resize; z-index:2;
    background:linear-gradient(135deg, transparent 50%, #3dff8a 50%, #3dff8a 60%, transparent 60%, transparent 72%, #3dff8a 72%, #3dff8a 82%, transparent 82%);
  }
  body.wm-busy .window iframe{ pointer-events:none; } /* stop iframes eating the mouse mid-drag/resize */
  body.wm-busy{ user-select:none; }
  .window iframe{ flex:1; min-height:0; border:none; width:100%; background:#fff; }
  .window .window-body{ flex:1; min-height:0; padding:16px 18px; overflow:auto; background:#020805; color:#3dff8a; }

  .icon-btn.reveal-flicker{ animation:revealFlicker 0.7s ease-in-out; }
  @keyframes revealFlicker{ 0%,100%{ opacity:1; } 20%,60%{ opacity:0.15; } 40%,80%{ opacity:0.7; } }

  /* ---------- TRELLO-MIMIC PRODUCTION BOARD ---------- */
  .board{ display:flex; gap:10px; height:100%; overflow-x:auto; font-size:0.68rem; }
  .board-col{ min-width:150px; flex:1; border:1px solid #1f6b40; padding:8px; display:flex; flex-direction:column; gap:8px; }
  .board-col h4{ margin:0 0 2px; font-size:0.65rem; letter-spacing:1px; opacity:0.8; border-bottom:1px solid #1f6b40; padding-bottom:6px; }
  .board-card{ border:1px solid #3dff8a; padding:8px; line-height:1.5; position:relative; }
  .board-card .badge{ position:absolute; top:-8px; right:-6px; background:#3dff8a; color:#020805; font-size:0.55rem; padding:2px 5px; font-weight:bold; }
  .board-card .title{ font-weight:bold; margin-bottom:4px; }

  /* ---------- TASKBAR ---------- */
  .taskbar{
    position:absolute; left:0; right:0; bottom:0; height:38px; display:flex; align-items:center;
    gap:10px; padding:0 12px; border-top:1px solid #1f6b40; background:#020805; font-size:0.68rem; z-index:50;
  }
  .taskbar .start{ border:1px solid #3dff8a; padding:5px 10px; letter-spacing:1px; }
  .taskbar .tabs{ display:flex; gap:8px; flex:1; overflow-x:auto; }
  .taskbar .tab{ border:1px solid #1f6b40; padding:5px 10px; cursor:pointer; white-space:nowrap; }
  .taskbar .tab.active{ border-color:#3dff8a; }
  .taskbar .clock{ opacity:0.75; }

  /* ---------- FOLLOW RACCOON: red link to RED_OS (follow/). Remove these 2 rules + the <a class="follow-raccoon"> to undo. ---------- */
  .taskbar .follow-raccoon{
    color:#ff3b3b; text-decoration:none; font-family:'Space Mono', monospace; font-size:9px; line-height:1.05;
    white-space:pre; padding:2px 4px; border:1px solid transparent; text-shadow:0 0 6px rgba(255,59,59,0.55);
  }
  .taskbar .follow-raccoon:hover, .taskbar .follow-raccoon:focus-visible{ border-color:#ff3b3b; outline:none; }

  .hidden{ display:none !important; }

  /* ---------- MOBILE ---------- */
  @media (max-width: 720px){
    .widget{ position:static; width:100%; margin:14px 0; }
    .icons{ width:100%; justify-content:flex-start; }
    .window{
      position:fixed !important; inset:10px 10px 48px 10px !important; width:auto !important; height:auto !important;
    }
    .window .titlebar{ cursor:default; }
    .window .resize-grip{ display:none; }
  }
</style>
</head>
<body>

  <canvas id="matrixCanvas"></canvas>

  <div id="bootScreen" class="glow" tabindex="0" role="button" aria-label="Click or press Enter to boot">
    <div class="boot-text">CLICK / PRESS ENTER TO BOOT<span class="cursor"></span></div>
    <div class="boot-sub">COCO SYSTEMS TERMINAL v1.0</div>
  </div>

  <div id="desktop">
    <div class="topbar glow">
      <span>SECURE CHANNEL ESTABLISHED [GREEN]</span>

    <div class="icons">

        <span class="glyph">🗂</span>FULL_STACK.EXE
      </button>
      <button class="icon-btn highlight" data-prog="getstarted" onclick="openWindow('getstarted','GET_STARTED.EXE','get-started.html')">

      </button>

        <span class="glyph">●</span>PONG.EXE

        <span class="glyph">🔒</span>SECRET.TXT
      </button>

    <div class="widget glow" id="statusWidget" aria-live="polite">
      <h3>CURRENT INFRASTRUCTURE</h3>
      <div class="infra-line"><span>WORKSPACE</span><span class="status-ok">LIVE</span></div>
      <div class="infra-line"><span>DOMAIN: CRMCONSULTCO.COM</span><span class="status-ok">LIVE</span></div>
      <div class="infra-line"><span>PAYPAL BUSINESS</span><span class="status-ok">LIVE</span></div>
      <div class="infra-line"><span>LEAD INTAKE FORM</span><span class="status-ok">LIVE</span></div>
      <div class="infra-line"><span>ENTITY: COCO SYSTEMS LLC</span><span class="status-ok">ACTIVE</span></div>
    </div>

    <div id="windowLayer"></div>

    <div class="taskbar glow">
      <div class="start">COCO SYSTEMS</div>
      <div class="tabs" id="taskbarTabs"></div>
      <div class="clock" id="clock"></div>
      <a class="follow-raccoon" data-prog="follow" href="follow" title="Follow" aria-label="Follow COCO Systems. Plays a short, skippable retro crash animation."><span aria-hidden="true">/^\_/^\
(=0=0=)
  &gt;^&lt;</span></a>
    </div>
  </div>

<script>
  // ---------- BOOT ----------
  var bootScreen = document.getElementById('bootScreen');
  var desktop = document.getElementById('desktop');
  function boot(){
    if(bootScreen.classList.contains('flicker')) return;
    bootScreen.classList.add('flicker');
    setTimeout(function(){
      bootScreen.classList.add('hidden');
      desktop.classList.add('on');
    }, 460);
  }
  bootScreen.addEventListener('click', boot);
  bootScreen.addEventListener('keydown', function(e){
    if(e.key === 'Enter' || e.key === ' '){ e.preventDefault(); boot(); }
  });

  // ---------- STATUS WIDGET: describes whatever program the mouse is over ----------
  // Fields match Coco's spec: NAME / PRICING (a la carte vs. combo) / DESCRIPTION /
  // PRICE / RETAIL PRICE. CHOP_SHOP/BOOTH_RENT/INK_LOG prices are the CEO-confirmed
  // "from" estimates (2026-10-02 decisions log); FULL_STACK stays "Custom quote"
  // until the Simulation configurator exists. GET_STARTED/PONG are free; FOLLOW
  // uses the confirmed $50 Link Page price. estNote renders a small disclaimer
  // line under estimated prices only -- not shown for free/flat-confirmed items.
  var PROGRAMS = {
    chopshop:  { name:'CHOP_SHOP', pricing:'Custom build',
                 desc:'Book-now form, client database, and a drag-style production board &mdash; built for a mobile auto trim &amp; upholstery shop like Overland Mobile Trim.',
                 price:'From $1,750', retail:'From $2,600',
                 estNote:'Estimates. Flat price confirmed in writing before work starts.' },
    boothrent: { name:'BOOTH_RENT', pricing:'Custom build',
                 desc:'Booking form, renter roster, and a rent-due tracker &mdash; built for a salon or barbershop that rents chairs/booths.',
                 price:'From $1,250', retail:'From $1,850',
                 estNote:'Estimates. Flat price confirmed in writing before work starts.' },
    inklog:    { name:'INK_LOG', pricing:'Custom build',
                 desc:'Consult form, client log, and deposit tracking from first message to finished session &mdash; built for a tattoo studio or independent artist.',
                 price:'From $1,550', retail:'From $2,300',
                 estNote:'Estimates. Flat price confirmed in writing before work starts.' },
    fullstack: { name:'FULL_STACK', pricing:'&Agrave; la carte or bundled',
                 desc:'The whole system in one place: leads, clients, projects, payments, and follow-ups &mdash; priced to what you actually need.',
                 price:'Custom quote', retail:'Custom quote',
                 estNote:'Estimates. Flat price confirmed in writing before work starts.' },
    getstarted:{ name:'GET_STARTED', pricing:'&mdash;',
                 desc:'Tell us what you need. We reply with a free scoping call &mdash; no pressure, no obligation.',
                 price:'Free', retail:'Free' },
    pong:      { name:'PONG', pricing:'&mdash;',
                 desc:'A fully playable Pong clone, because every good terminal needs one.',
                 price:'Free', retail:'Free' },
    follow:    { name:'FOLLOW / LINK PAGE', pricing:'&Agrave; la carte &middot; $99 bundle upgrade available',
                 desc:'One mobile-friendly link-in-bio page for your socials, built once &mdash; you own it, no monthly fee.',
                 price:'$50 ($25 down, $25 on delivery)', retail:'$50' }
  };
  var statusWidget = document.getElementById('statusWidget');
  var statusDefault = statusWidget.innerHTML;
  function showProgram(key){
    var p = PROGRAMS[key]; if(!p) return;
    statusWidget.innerHTML =
      '<h3>PROGRAM STATS</h3>' +
      '<div class="infra-line"><span>NAME</span><span>' + p.name + '</span></div>' +
      '<div class="infra-line"><span>PRICING</span><span>' + p.pricing + '</span></div>' +
      '<div class="w-note">DESCRIPTION:<br>' + p.desc + '</div>' +
      '<div class="infra-line"><span>PRICE</span><span>' + p.price + '</span></div>' +
      '<div class="infra-line"><span>RETAIL PRICE</span><span>' + p.retail + '</span></div>' +
      (p.estNote ? '<div class="w-note">' + p.estNote + '</div>' : '');
  }
  function resetStatus(){ statusWidget.innerHTML = statusDefault; }
  document.querySelectorAll('[data-prog]').forEach(function(btn){
    btn.addEventListener('mouseenter', function(){ showProgram(btn.dataset.prog); });
    btn.addEventListener('focus', function(){ showProgram(btn.dataset.prog); });
    btn.addEventListener('mouseleave', resetStatus);
    btn.addEventListener('blur', resetStatus);
  });

  // ---------- CLOCK ----------
  function updateClock(){
    document.getElementById('clock').textContent = new Date().toLocaleTimeString([], {hour:'2-digit', minute:'2-digit'});
  }
  updateClock();
  setInterval(updateClock, 15000);

  // ---------- WINDOW MANAGER ----------
  var openWindows = {};
  var zTop = 10;
  var isMobile = function(){ return window.innerWidth <= 720; };

  function openWindow(id, title, url, htmlContent){
    if(openWindows[id]){
      focusWindow(id);
      return;
    }
    var win = document.createElement('div');
    win.className = 'window';
    win.style.zIndex = ++zTop;
    if(!isMobile()){
      var n = Object.keys(openWindows).length;
      var w = Math.min(520, window.innerWidth - 40);
      var h = Math.min(540, window.innerHeight - 90);
      win.style.width = w + 'px';
      win.style.height = h + 'px';
      win.style.left = Math.min(60 + n * 26, Math.max(0, window.innerWidth - w - 10)) + 'px';
      win.style.top = Math.min(70 + n * 26, Math.max(0, window.innerHeight - h - 48)) + 'px';
    }
    // Cache-bust every iframe load so updates to the linked page (get-started.html,
    // the demo-*.html files) always show up immediately instead of a stale cached copy.
    var freshUrl = url ? url + (url.indexOf('?') === -1 ? '?' : '&') + '_=' + Date.now() : url;
    var bodyMarkup = htmlContent
      ? '<div class="window-body">' + htmlContent + '</div>'
      : '<iframe src="' + freshUrl + '" title="' + title + '"></iframe>';
    // Third titlebar button: only for windows backed by a real page (url is set).
    // Generated-content windows (production board, estimate, clients db, pong,
    // the secret note) have nothing of their own to open in a tab, so they keep
    // just the original two.
    var newTabBtn = url
      ? '<span class="newtab" title="Open in new tab" aria-label="Open in new tab"></span>'
      : '';
    win.innerHTML =
      '<div class="titlebar">' +
        '<span>' + title + '</span>' +
        '<div class="dots">' +
          '<span class="min" title="Minimize"></span>' +
          newTabBtn +
          '<span class="close" title="Close"></span>' +
        '</div>' +
      '</div>' +
      bodyMarkup +
      '<div class="resize-grip" title="Resize"></div>';

    document.getElementById('windowLayer').appendChild(win);
    openWindows[id] = win;

    win.querySelector('.close').addEventListener('click', function(){ closeWindow(id); });
    win.querySelector('.min').addEventListener('click', function(){ minimizeWindow(id); });
    if(url){
      win.querySelector('.newtab').addEventListener('click', function(){ window.open(url, '_blank', 'noopener'); });
    }
    win.addEventListener('mousedown', function(){ focusWindow(id); });

    makeDraggable(win, win.querySelector('.titlebar'));
    makeResizable(win, win.querySelector('.resize-grip'));
    addTaskbarTab(id, title);
    focusWindow(id);
  }

  function closeWindow(id){
    if(!openWindows[id]) return;
    openWindows[id].remove();
    delete openWindows[id];
    removeTaskbarTab(id);
    if(id === 'pong' && pongInterval){ clearInterval(pongInterval); pongInterval = null; }
  }

  function minimizeWindow(id){
    if(!openWindows[id]) return;
    openWindows[id].classList.toggle('hidden');
  }

  function focusWindow(id){
    if(!openWindows[id]) return;
    openWindows[id].classList.remove('hidden');
    openWindows[id].style.zIndex = ++zTop;
    document.querySelectorAll('.taskbar .tab').forEach(function(t){ t.classList.remove('active'); });
    var tab = document.getElementById('tab-' + id);
    if(tab) tab.classList.add('active');
  }

  function addTaskbarTab(id, title){
    var tab = document.createElement('div');
    tab.className = 'tab';
    tab.id = 'tab-' + id;
    tab.textContent = title;
    tab.addEventListener('click', function(){
      if(openWindows[id].classList.contains('hidden')){
        focusWindow(id);
      } else {
        minimizeWindow(id);
      }
    });
    document.getElementById('taskbarTabs').appendChild(tab);
  }

  function removeTaskbarTab(id){
    var tab = document.getElementById('tab-' + id);
    if(tab) tab.remove();
  }

  function makeDraggable(win, handle){
    var dragging = false, offsetX = 0, offsetY = 0;
    handle.addEventListener('mousedown', function(e){
      if(isMobile()) return;
      dragging = true;
      offsetX = e.clientX - win.offsetLeft;
      offsetY = e.clientY - win.offsetTop;
      document.body.classList.add('wm-busy');
      e.preventDefault();
    });
    document.addEventListener('mousemove', function(e){
      if(!dragging) return;
      win.style.left = Math.min(window.innerWidth - 80, Math.max(80 - win.offsetWidth, e.clientX - offsetX)) + 'px';
      win.style.top = Math.min(window.innerHeight - 70, Math.max(0, e.clientY - offsetY)) + 'px';
    });
    document.addEventListener('mouseup', function(){
      if(dragging) document.body.classList.remove('wm-busy');
      dragging = false;
    });
  }

  function makeResizable(win, grip){
    var resizing = false, startX, startY, startW, startH;
    grip.addEventListener('mousedown', function(e){
      if(isMobile()) return;
      resizing = true;
      startX = e.clientX; startY = e.clientY;
      startW = win.offsetWidth; startH = win.offsetHeight;
      document.body.classList.add('wm-busy');
      e.preventDefault(); e.stopPropagation();
    });
    document.addEventListener('mousemove', function(e){
      if(!resizing) return;
      var maxW = window.innerWidth - win.offsetLeft - 4;
      var maxH = window.innerHeight - win.offsetTop - 42;
      win.style.width = Math.max(280, Math.min(maxW, startW + e.clientX - startX)) + 'px';
      win.style.height = Math.max(200, Math.min(maxH, startH + e.clientY - startY)) + 'px';
    });
    document.addEventListener('mouseup', function(){
      if(resizing) document.body.classList.remove('wm-busy');
      resizing = false;
    });
  }

  // ---------- CHOP_SHOP: Overland Mobile Trim themed board + database ----------
  // Per house rule: CRT green stays on the home page only. Anything spawned
  // from inside a program's own demo is that business's own themed build —
  // window chrome (titlebar/drag/close) stays consistent OS shell, but the
  // content inside is Overland Mobile Trim's own blue/steel look, not green.
  // NOTE (Engineering, 2026-10-08): this sample business name is a made-up
  // stand-in. Standing rule: never name the trim shop from the legal matter
  // anywhere in this file — if you're renaming this again, change every
  // "Overland Mobile Trim" string below and nothing else needs to move.
  var chopShopWindowCount = 0;
  var lastChopTicket = null;

  window.addEventListener('message', function(e){
    if(e.data && e.data.type === 'chopshop-ticket'){
      chopShopWindowCount++;
      // Universal small-business workflow: New Lead -> Estimate -> Deposit ->
      // Drop-off Scheduled -> Work Complete -> Final Payment -> Pickup. Same
      // shape works for salons/tattoo studios/etc, just relabeled per vertical.
      var sampleClients = [
        { id:'C-1021', first:'Marcus', last:'Webb', email:'marcus.webb@example.com', phone:'(720) 555-0148', vehicle:'2016 Chevy Silverado', service:'Seat re-upholstery', stage:'estimate' },
        { id:'C-1034', first:'Priya', last:'Shah', email:'priya.shah@example.com', phone:'(303) 555-0199', vehicle:'2020 Subaru Outback', service:'Headliner replacement', stage:'deposit' },
        { id:'C-1042', first:'Devon', last:'Cole', email:'devon.cole@example.com', phone:'(720) 555-0173', vehicle:'2014 Jeep Wrangler', service:'Full interior re-trim', stage:'dropoff' },
        { id:'C-1055', first:'Renee', last:'Ibarra', email:'renee.ibarra@example.com', phone:'(303) 555-0182', vehicle:'2019 Ford Transit', service:'Door panel repair', stage:'complete' },
        { id:'C-1063', first:'Tasha', last:'Reyes', email:'tasha.reyes@example.com', phone:'(720) 555-0164', vehicle:'2017 Honda CR-V', service:'Dash repair', stage:'finalpayment' },
        { id:'C-1071', first:'Oliver', last:'Kim', email:'oliver.kim@example.com', phone:'(303) 555-0177', vehicle:'2015 Toyota Tacoma', service:'Bed liner install', stage:'pickup' }
      ];
      var d = e.data.data;
      var newClient = {
        id: 'C-NEW', first: d.firstName, last: d.lastName, email: d.email, phone: d.phone,
        vehicle: [d.vehYear, d.vehMake, d.vehModel].filter(Boolean).join(' '),
        service: d.service, stage: 'newlead', isNew: true

  // ---------- PONG.EXE ----------
  var pongInterval = null;

  function openPong(){
    openWindow('pong', 'PONG.EXE', null,
      '<canvas id="pongCanvas" width="320" height="320" style="display:block;margin:0 auto;background:#000;border:1px solid #1f6b40;max-width:100%;"></canvas>' +
      '<div style="text-align:center;font-size:0.68rem;opacity:0.7;margin-top:10px;">&uarr; / &darr; or mouse to move &middot; first to 5</div>'
    );
    initPong();
  }

  function initPong(){
    if(pongInterval){ clearInterval(pongInterval); pongInterval = null; }
    var canvas = document.getElementById('pongCanvas');
    if(!canvas) return;
    var ctx = canvas.getContext('2d');
    var W = canvas.width, H = canvas.height;
    var paddleH = 54, paddleW = 8;
    var playerY = H/2 - paddleH/2, cpuY = H/2 - paddleH/2;
    var ballX = W/2, ballY = H/2, ballVX = 3, ballVY = 2;
    var playerScore = 0, cpuScore = 0, over = false;

    canvas.tabIndex = 0;
    canvas.addEventListener('mousemove', function(e){
      var rect = canvas.getBoundingClientRect();
      playerY = (e.clientY - rect.top) - paddleH/2;
      playerY = Math.max(0, Math.min(H - paddleH, playerY));
    });
    canvas.addEventListener('keydown', function(e){
      if(e.key === 'ArrowUp'){ playerY = Math.max(0, playerY - 22); e.preventDefault(); }
      if(e.key === 'ArrowDown'){ playerY = Math.min(H - paddleH, playerY + 22); e.preventDefault(); }
    });

    function resetBall(dir){
      ballX = W/2; ballY = H/2;
      ballVX = 3 * dir; ballVY = (Math.random() * 4) - 2;
    }

    function step(){
      if(over) return;
      ballX += ballVX; ballY += ballVY;
      if(ballY <= 0 || ballY >= H) ballVY *= -1;

      if(ballX <= paddleW + 6 && ballX > paddleW && ballY >= playerY && ballY <= playerY + paddleH){
        ballVX = Math.abs(ballVX) * 1.05;
      }
      if(ballX >= W - paddleW - 6 && ballX < W - paddleW && ballY >= cpuY && ballY <= cpuY + paddleH){
        ballVX = -Math.abs(ballVX) * 1.05;
      }

      var cpuCenter = cpuY + paddleH / 2;
      if(cpuCenter < ballY - 10) cpuY += 2.6;
      else if(cpuCenter > ballY + 10) cpuY -= 2.6;
      cpuY = Math.max(0, Math.min(H - paddleH, cpuY));

      if(ballX < 0){ cpuScore++; resetBall(1); }
      if(ballX > W){ playerScore++; resetBall(-1); }
      if(playerScore >= 5 || cpuScore >= 5) over = true;

      ctx.fillStyle = '#000'; ctx.fillRect(0, 0, W, H);
      ctx.fillStyle = '#3dff8a';
      ctx.fillRect(4, playerY, paddleW, paddleH);
      ctx.fillRect(W - paddleW - 4, cpuY, paddleW, paddleH);
      ctx.beginPath(); ctx.arc(ballX, ballY, 5, 0, Math.PI * 2); ctx.fill();
      ctx.font = '16px monospace';
      ctx.fillText(playerScore + '  -  ' + cpuScore, W / 2 - 24, 20);
      if(over){
        ctx.font = '14px monospace';
        ctx.fillText(playerScore > cpuScore ? 'YOU WIN' : 'CPU WINS', W / 2 - 36, H / 2);
      }
    }
    pongInterval = setInterval(step, 1000 / 50);
  }

  // ---------- LIGHT MATRIX RAIN ----------
  (function(){
    var canvas = document.getElementById('matrixCanvas');
    var ctx = canvas.getContext('2d');
    var fontSize = 18;
    var drops = [];
    var columnWords = [];

    var words = ['GROW','BUILD','RISE','CREATE','TRUST','BELIEVE','OWN IT','KEEP GOING','GRATITUDE','THANK YOU','FAMILY','ONWARD','PERSIST','SIMPLE','REAL'];
    function randomWord(){ return words[Math.floor(Math.random() * words.length)] + '     '; }

    function setup(){
      canvas.width = window.innerWidth;
      canvas.height = window.innerHeight;
      var columns = Math.floor(canvas.width / fontSize);
      drops = new Array(columns).fill(0).map(function(){ return Math.random() * -40; });
      columnWords = new Array(columns).fill(0).map(function(){ return { word: randomWord(), idx: 0 }; });
    }
    setup();
    window.addEventListener('resize', setup);

    function draw(){
      ctx.fillStyle = 'rgba(2,8,5,0.10)';
      ctx.fillRect(0, 0, canvas.width, canvas.height);
      ctx.fillStyle = '#3dff8a';
      ctx.font = fontSize + 'px monospace';
      for(var i = 0; i < drops.length; i++){
        var cw = columnWords[i];
        var ch = cw.word[cw.idx % cw.word.length];
        cw.idx++;
        if(ch !== ' '){
          ctx.fillText(ch, i * fontSize, drops[i] * fontSize);
        }
        if(drops[i] * fontSize > canvas.height && Math.random() > 0.978){
          drops[i] = 0;
          cw.word = randomWord();
          cw.idx = 0;
        }
        drops[i]++;
      }
    }
    setInterval(draw, 80);
  })();
