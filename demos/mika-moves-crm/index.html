<!DOCTYPE html><html lang="en"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1"><meta name="robots" content="noindex"><title>Mika Moves — CRM demo</title><style>:root{--bg:#111;--card:#1b1b1b;--text:#f2f2f2;--muted:#a0a0a0;--accent:#3dff8a;--accentText:#000;--line:rgba(255,255,255,.1)}
*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--text);font-family:system-ui,-apple-system,"Segoe UI",Roboto,sans-serif}
#app{max-width:1100px;margin:0 auto;padding:0 16px 40px;display:grid;grid-template-columns:1fr 280px;gap:0 20px}
.banner,header,.tabs,footer{grid-column:1/-1}.banner{background:var(--accent);color:var(--accentText);text-align:center;font-size:.78rem;padding:6px;margin:0 -16px;font-weight:600}
.banner a{color:inherit}header h1{margin:18px 0 2px;font-size:1.5rem}header p{margin:0;color:var(--muted)}
.tabs{display:flex;gap:6px;flex-wrap:wrap;margin:16px 0;border-bottom:1px solid var(--line);padding-bottom:10px}
.tabs button{background:var(--card);color:var(--text);border:1px solid var(--line);border-radius:999px;padding:8px 14px;cursor:pointer;font:inherit;font-size:.88rem}
.tabs button[aria-selected=true]{background:var(--accent);color:var(--accentText);border-color:var(--accent)}
.card{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:18px}.card h2{margin:0 0 6px;font-size:1.1rem}
.muted{color:var(--muted);font-size:.85rem;line-height:1.45}.tip{margin-top:12px}
label{display:block;font-size:.82rem;color:var(--muted);margin:12px 0 4px}input,select{width:100%;padding:10px;border-radius:8px;border:1px solid var(--line);background:var(--bg);color:var(--text);font:inherit}
form button,.kcard button{background:var(--accent);color:var(--accentText);border:0;border-radius:8px;padding:10px 14px;font:inherit;font-weight:600;cursor:pointer;margin-top:14px}
.ok{color:var(--accent);font-size:.88rem}.two{display:grid;grid-template-columns:260px 1fr;gap:18px;align-items:start}
.phone{border:8px solid #000;border-radius:28px;background:var(--bg);padding:20px 12px;box-shadow:0 0 0 1px var(--line)}
.lp{display:flex;flex-direction:column;align-items:center;gap:8px;text-align:center}.lp small{color:var(--muted);font-size:.72rem}
.av{width:56px;height:56px;border-radius:50%;border:2px solid var(--accent);display:flex;align-items:center;justify-content:center;font-weight:700;color:var(--accent)}
.lpb{display:block;width:100%;padding:10px;border-radius:10px;background:var(--card);color:var(--text);text-decoration:none;font-size:.82rem;font-weight:600;border:1px solid var(--line)}.lpb.pri{background:var(--accent);color:var(--accentText)}
.board{display:flex;gap:10px;overflow-x:auto;padding-bottom:8px}.col{min-width:180px;flex:1;background:var(--card);border-radius:12px;padding:10px;border:1px solid var(--line)}
.col h4{margin:0 0 8px;font-size:.78rem;letter-spacing:.04em;text-transform:uppercase;color:var(--muted);display:flex;justify-content:space-between}
.kcard{background:var(--bg);border:1px solid var(--line);border-radius:10px;padding:10px;margin-bottom:8px;display:flex;flex-direction:column;gap:3px;position:relative;font-size:.84rem}
.kcard small{color:var(--muted)}.kcard.new{border-color:var(--accent)}.kcard button{margin-top:6px;padding:6px 8px;font-size:.75rem}.done{color:var(--accent)!important}
.badge{position:absolute;top:-8px;right:8px;background:var(--accent);color:var(--accentText);font-size:.62rem;font-weight:700;padding:2px 6px;border-radius:4px}
.scroll{overflow-x:auto}table{width:100%;border-collapse:collapse;font-size:.84rem}th,td{text-align:left;padding:8px;border-bottom:1px solid var(--line);white-space:nowrap}th{color:var(--muted);font-weight:600}tr.hl td{color:var(--accent)}
tfoot td{border-top:2px solid var(--line)}.stats{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:10px;margin:14px 0}
.stats div{background:var(--card);border:1px solid var(--line);border-radius:12px;padding:12px}.stats small{display:block;color:var(--muted);font-size:.75rem}.stats b{font-size:1.3rem}
.autos{padding-left:18px;line-height:1.6}.autos li{margin-bottom:6px}
.feed{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:12px;align-self:start;position:sticky;top:12px;max-height:80vh;overflow:auto}
.feed h3{margin:0 0 8px;font-size:.85rem}.feed ol{list-style:none;margin:0;padding:0;font-size:.78rem}.feed li{padding:6px 0;border-bottom:1px solid var(--line);line-height:1.35}
.feed time{color:var(--muted)}.feed .auto{color:var(--accent)}.feed .money{color:#ffd166}
footer{margin-top:24px;font-size:.75rem;color:var(--muted)}footer a{color:var(--muted)}
@media(max-width:820px){#app{grid-template-columns:1fr}.feed{position:static;margin-top:16px}.two{grid-template-columns:1fr}.phone{max-width:280px;margin:0 auto}}
main{min-width:0}
</style></head><body><div id="app"></div><script>window.DEMO={"name": "Mika Moves", "initials": "MM", "tagline": "Fitness & lifestyle creator \u00b7 brand partnerships", "idPrefix": "MM", "recordLabel": "Deal", "titleKey": "brand", "subKey": "ask", "theme": {"bg": "#1a0f24", "card": "#2a1a3a", "text": "#fbf4ff", "muted": "#c7b2d9", "accent": "#ff6ec7", "accentText": "#1a0f24", "line": "rgba(255,255,255,.1)"}, "links": ["Media kit & rates", "Work with me", "Latest video", "Gear & codes"], "form": {"title": "Work with Mika", "blurb": "Brands: tell me about the campaign. Inquiries land in my tracker, not my DMs.", "button": "Send inquiry", "thanks": "Thanks! You'll get my media kit and rates by email.", "fields": [{"key": "brand", "label": "Brand", "ph": "Brand name", "demo": "TrailFuel Snacks"}, {"key": "ask", "label": "Campaign", "options": ["1 Reel", "Reel + 3 Stories", "Monthly ambassador", "UGC only"]}, {"key": "budget", "label": "Budget", "options": ["Under $500", "$500\u2013$1,500", "$1,500\u2013$5,000", "$5,000+"]}, {"key": "contact", "label": "Work email", "ph": "you@brand.com", "demo": "partners@trailfuel.example"}]}, "stages": ["Inquiry", "Rates sent", "Negotiating", "Contract signed", "Content live", "Paid"], "defaultValue": 1200, "onNew": ["Alert to Mika", "Auto-reply to {name} with the media kit + rate card"], "automations": {"Rates sent": ["Follow-up in 4 days if no reply"], "Contract signed": ["Deliverables + due dates added to the content calendar", "Invoice drafted (50% up front)"], "Content live": ["Post links logged; performance check-in scheduled for 7 days"], "Paid": ["Thank-you + 'work together again?' email in 60 days"]}, "daily": ["Digest: deliverables due this week, unpaid invoices, inquiries waiting on a reply"], "moneyStages": {"Contract signed": {"label": "50% up front", "pct": 0.5}, "Paid": {"label": "Final 50%", "pct": 0.5}}, "moneyNote": "Invoices go out through PayPal. FTC rules require clear #ad disclosure on paid posts. The tracker has a disclosure checkbox per deliverable.", "columns": [["brand", "Brand"], ["ask", "Campaign"], ["budget", "Budget"], ["contact", "Contact"], ["value", "Deal value"]], "seed": [{"brand": "PeakBottle", "ask": "Reel + 3 Stories", "budget": "$500\u2013$1,500", "contact": "hi@peakbottle.example", "stage": "Negotiating", "value": 1100}, {"brand": "Lumen Gym", "ask": "Monthly ambassador", "budget": "$1,500\u2013$5,000", "contact": "mktg@lumen.example", "stage": "Contract signed", "value": 3000}, {"brand": "Ripple Wear", "ask": "UGC only", "budget": "Under $500", "contact": "ugc@ripple.example", "stage": "Rates sent", "value": 400}, {"brand": "Sol Protein", "ask": "1 Reel", "budget": "$500\u2013$1,500", "contact": "collab@sol.example", "stage": "Content live", "value": 900}], "cost": {"build": [{"item": "Link page (media kit, work with me, video, codes)", "flat": 50}, {"item": "Media kit one-pager", "flat": 95}, {"item": "Brand inquiry form \u2192 deal tracker + auto-reply", "hrs": 3}, {"item": "Deal pipeline + content calendar tabs", "hrs": 3}, {"item": "Invoice tracker (PayPal) + follow-up emails", "hrs": 2}, {"item": "Weekly deliverables digest", "hrs": 1}, {"item": "Testing, SOP & handoff", "hrs": 1.5}], "running": [["Domain name", "~$20/yr"], ["Google Sheets / Forms / Apps Script", "$0 on a free Google account"], ["Branded email (optional)", "Google Workspace Business Starter, if the owner wants a branded email (~$7/user/mo annual, ~$8.40 flexible)"], ["PayPal", "per-transaction fees only (check PayPal's current rate)"], ["Hosting (GitHub Pages)", "$0"]], "note": "Audience stats in the media kit come from the creator's own platform analytics and are updated by the creator."}};</script><script>/* COCO Systems — interactive CRM demo engine. Each demo page sets window.DEMO = {...} then loads this file.
   Everything is in-memory (resets on reload). Fictional data only. */
(function () {
  var D = window.DEMO, $ = function (s) { return document.querySelector(s); };
  var esc = function (s) { return String(s == null ? '' : s).replace(/[&<>"]/g, function (m) { return { '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;' }[m]; }); };
  var money = function (n) { return '$' + Number(n || 0).toLocaleString(undefined, { minimumFractionDigits: 0, maximumFractionDigits: 2 }); };
  var root = document.documentElement.style;
  Object.keys(D.theme).forEach(function (k) { root.setProperty('--' + k, D.theme[k]); });
  var records = D.seed.map(function (r, i) { r.id = D.idPrefix + '-' + String(101 + i); return r; });
  var nextId = 101 + records.length, log = [];

  function now() { return new Date().toLocaleTimeString([], { hour: 'numeric', minute: '2-digit' }); }
  function addLog(kind, text) { log.unshift({ t: now(), kind: kind, text: text }); renderLog(); }

  /* ---------- shell ---------- */
  document.title = D.name + ' — CRM demo';
  $('#app').innerHTML =
    '<div class="banner">FICTIONAL DEMO by <a href="../" >COCO Systems</a> · nothing here is real or saved</div>' +
    '<header><h1>' + esc(D.name) + '</h1><p>' + esc(D.tagline) + '</p></header>' +
    '<nav class="tabs" role="tablist">' +
      ['customer:Customer side', 'pipeline:Pipeline', 'clients:' + D.recordLabel + 's', 'money:Money', 'auto:Automations', 'cost:What it costs'].map(function (t, i) {
        var p = t.split(':'); return '<button role="tab" data-tab="' + p[0] + '"' + (i ? '' : ' aria-selected="true"') + '>' + esc(p[1]) + '</button>';
      }).join('') + '</nav>' +
    '<main>' +
      '<section id="t-customer"></section><section id="t-pipeline" hidden></section><section id="t-clients" hidden></section>' +
      '<section id="t-money" hidden></section><section id="t-auto" hidden></section><section id="t-cost" hidden></section>' +
    '</main><aside class="feed"><h3>Live activity</h3><ol id="feed"></ol></aside>' +
    '<footer>Built by <a href="https://crmconsultco.com">COCO Systems</a> · Google Sheets + Forms + Apps Script + PayPal · the client owns every account</footer>';

  document.querySelectorAll('.tabs button').forEach(function (b) {
    b.addEventListener('click', function () {
      document.querySelectorAll('.tabs button').forEach(function (x) { x.removeAttribute('aria-selected'); });
      b.setAttribute('aria-selected', 'true');
      document.querySelectorAll('main section').forEach(function (s) { s.hidden = true; });
      $('#t-' + b.dataset.tab).hidden = false;
      render();
    });
  });

  /* ---------- customer side ---------- */
  function renderCustomer() {
    var f = D.form;
    $('#t-customer').innerHTML =
      '<div class="two"><div class="phone"><div class="lp"><div class="av">' + esc(D.initials) + '</div><b>' + esc(D.name) + '</b><small>' + esc(D.tagline) + '</small>' +
      D.links.map(function (l, i) { return '<a href="#form" class="lpb' + (i ? '' : ' pri') + '">' + esc(l) + '</a>'; }).join('') + '</div></div>' +
      '<form id="form" class="card"><h2>' + esc(f.title) + '</h2><p class="muted">' + esc(f.blurb) + '</p>' +
      f.fields.map(function (x) {
        var id = 'f_' + x.key;
        var input = x.options ? '<select id="' + id + '">' + x.options.map(function (o) { return '<option>' + esc(o) + '</option>'; }).join('') + '</select>'
          : '<input id="' + id + '" placeholder="' + esc(x.ph || '') + '">';
        return '<label for="' + id + '">' + esc(x.label) + '</label>' + input;
      }).join('') +
      '<button type="submit">' + esc(f.button) + '</button><p class="ok" id="ok" hidden></p></form></div>' +
      '<p class="muted tip">Try it: submit the form, then open <b>Pipeline</b> and move the new card forward. Watch <b>Live activity</b>.</p>';
    $('#form').addEventListener('submit', function (e) {
      e.preventDefault();
      var r = { stage: D.stages[0], value: D.defaultValue, isNew: true };
      D.form.fields.forEach(function (x) { r[x.key] = ($('#f_' + x.key).value || '').trim() || x.demo; });
      r.id = D.idPrefix + '-' + (nextId++);
      records.push(r);
      $('#ok').hidden = false; $('#ok').textContent = D.form.thanks;
      addLog('form', 'New ' + D.recordLabel.toLowerCase() + ' ' + r.id + ' (' + r[D.titleKey] + ') saved to the Google Sheet');
      (D.onNew || []).forEach(function (a) { addLog('auto', a.replace('{name}', r[D.titleKey])); });
    });
  }

  /* ---------- pipeline ---------- */
  function renderPipeline() {
    $('#t-pipeline').innerHTML = '<div class="board">' + D.stages.map(function (s, si) {
      var cards = records.filter(function (r) { return r.stage === s; }).map(function (r) {
        return '<div class="kcard' + (r.isNew ? ' new' : '') + '">' + (r.isNew ? '<span class="badge">NEW</span>' : '') +
          '<b>' + esc(r[D.titleKey]) + '</b><small>' + esc(r[D.subKey]) + '</small><small>' + money(r.value) + '</small>' +
          (si < D.stages.length - 1 ? '<button data-adv="' + r.id + '">Move to ' + esc(D.stages[si + 1]) + ' →</button>' : '<small class="done">Complete</small>') + '</div>';
      }).join('');
      return '<div class="col"><h4>' + esc(s) + ' <span>' + records.filter(function (r) { return r.stage === s; }).length + '</span></h4>' + cards + '</div>';
    }).join('') + '</div>';
    document.querySelectorAll('[data-adv]').forEach(function (b) {
      b.addEventListener('click', function () {
        var r = records.filter(function (x) { return x.id === b.dataset.adv; })[0];
        var to = D.stages[D.stages.indexOf(r.stage) + 1];
        r.stage = to;
        addLog('stage', r.id + ' → ' + to);
        (D.automations[to] || []).forEach(function (a) { addLog('auto', a.replace('{name}', r[D.titleKey])); });
        if (D.moneyStages[to]) addLog('money', D.moneyStages[to].label + ' ' + money(r.value * D.moneyStages[to].pct) + ' recorded for ' + r[D.titleKey]);
        renderPipeline();
      });
    });
  }

  /* ---------- table ---------- */
  function renderClients() {
    var cols = D.columns;
    $('#t-clients').innerHTML = '<div class="scroll"><table><thead><tr><th>ID</th>' + cols.map(function (c) { return '<th>' + esc(c[1]) + '</th>'; }).join('') + '<th>Stage</th></tr></thead><tbody>' +
      records.map(function (r) { return '<tr' + (r.isNew ? ' class="hl"' : '') + '><td>' + esc(r.id) + '</td>' + cols.map(function (c) { return '<td>' + esc(c[0] === 'value' ? money(r.value) : r[c[0]]) + '</td>'; }).join('') + '<td>' + esc(r.stage) + '</td></tr>'; }).join('') +
      '</tbody></table></div><p class="muted">This is a tab in the owner\'s Google Sheet. Filter, sort and export to CSV with no extra software.</p>';
  }

  /* ---------- money ---------- */
  function renderMoney() {
    var collected = 0, open = 0;
    var rows = records.map(function (r) {
      var si = D.stages.indexOf(r.stage), paid = 0;
      Object.keys(D.moneyStages).forEach(function (s) { if (D.stages.indexOf(s) <= si) paid += r.value * D.moneyStages[s].pct; });
      collected += paid; open += r.value - paid;
      return '<tr><td>' + esc(r.id) + '</td><td>' + esc(r[D.titleKey]) + '</td><td>' + money(r.value) + '</td><td>' + money(paid) + '</td><td>' + money(r.value - paid) + '</td></tr>';
    }).join('');
    $('#t-money').innerHTML = '<div class="stats"><div><small>Collected</small><b>' + money(collected) + '</b></div><div><small>Still owed</small><b>' + money(open) + '</b></div><div><small>Active</small><b>' + records.filter(function (r) { return r.stage !== D.stages[D.stages.length - 1]; }).length + '</b></div></div>' +
      '<div class="scroll"><table><thead><tr><th>ID</th><th>' + esc(D.recordLabel) + '</th><th>Total</th><th>Paid</th><th>Balance</th></tr></thead><tbody>' + rows + '</tbody></table></div>' +
      '<p class="muted">' + esc(D.moneyNote) + '</p>';
  }

  /* ---------- automations ---------- */
  function renderAuto() {
    $('#t-auto').innerHTML = '<div class="card"><h2>What runs by itself</h2><ul class="autos">' +
      '<li><b>When the form is submitted:</b> ' + esc((D.onNew || []).join(' · ')) + '</li>' +
      Object.keys(D.automations).map(function (s) { return '<li><b>When moved to ' + esc(s) + ':</b> ' + esc(D.automations[s].join(' · ')) + '</li>'; }).join('') +
      (D.daily || []).map(function (d) { return '<li><b>Every morning:</b> ' + esc(d) + '</li>'; }).join('') +
      '</ul><p class="muted">Every email is drafted from a template the owner can edit in the Sheet. Nothing is sent to a customer without a template the owner approved.</p></div>';
  }

  /* ---------- cost ---------- */
  function renderCost() {
    var C = D.cost, hrs = 0, flat = 0;
    var rows = C.build.map(function (b) {
      if (b.flat) flat += b.flat; else hrs += b.hrs;
      return '<tr><td>' + esc(b.item) + '</td><td>' + (b.flat ? 'flat' : b.hrs + ' hr') + '</td><td>' + (b.flat ? money(b.flat) : money(b.hrs * 150)) + '</td></tr>';
    }).join('');
    var std = flat + hrs * 150, first = flat + hrs * 100;
    var run = C.running.map(function (r) { return '<tr><td>' + esc(r[0]) + '</td><td>' + esc(r[1]) + '</td></tr>'; }).join('');
    $('#t-cost').innerHTML = '<div class="card"><h2>Build cost (one-time, estimate)</h2><div class="scroll"><table><thead><tr><th>Piece</th><th>Time</th><th>Standard ($150/hr)</th></tr></thead><tbody>' + rows +
      '</tbody><tfoot><tr><td><b>Total</b></td><td>' + hrs + ' hr + flat</td><td><b>' + money(std) + '</b></td></tr></tfoot></table></div>' +
      '<div class="stats"><div><small>Standard rate</small><b>' + money(std) + '</b></div><div><small>First-job rate ($100/hr)</small><b>' + money(first) + '</b></div><div><small>Deposit to start (50%)</small><b>' + money(first / 2) + '</b></div></div>' +
      '<h2>Running costs (paid by the owner, to the vendor)</h2><div class="scroll"><table><tbody>' + run + '</tbody></table></div>' +
      '<p class="muted">' + esc(C.note) + ' Estimates only. Hours are COCO Systems\' estimate for this scope; vendor prices change, so they\'re confirmed before any quote. Optional Systems Care plan: $195/mo.</p></div>';
  }

  function renderLog() { var f = $('#feed'); if (f) f.innerHTML = log.slice(0, 14).map(function (l) { return '<li class="' + l.kind + '"><time>' + l.t + '</time> ' + esc(l.text) + '</li>'; }).join('') || '<li class="muted">Nothing yet. Submit the form.</li>'; }
  function render() { renderCustomer(); renderPipeline(); renderClients(); renderMoney(); renderAuto(); renderCost(); renderLog(); }
  render();
})();
</script></body></html>
